version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: diario_copa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: db_diariocopa
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "11000:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api-diariocopa:
    build: 
      context: ./DiarioCopaApi
    container_name: diario_copa_api
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql-db;Port=3306;Database=db_diariocopa;Uid=${DB_USER};Pwd=${DB_PASSWORD};
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=${JWT_KEY}
volumes:
  mysql_data: