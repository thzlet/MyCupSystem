<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Listas – Diário da Copa 2026</title>
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/listas.css" />
</head>
<body>

  <header class="topbar">
    <span class="topbar__brand">🏆 Diário Copa 2026</span>
    <nav>
      <a href="home.html">Início</a>
      <a href="listas.html" class="active">Listas</a>
      <a href="#" id="btnLogout">Sair</a>
    </nav>
  </header>

  <main class="pg-listas">

    <!-- Cabeçalho + botão nova lista -->
    <div class="pg-header">
      <h1>Minhas Listas</h1>
      <button class="btn-primary" id="btnNovaLista">+ Nova lista</button>
    </div>

    <!-- Formulário de criação (oculto por padrão) -->
    <div id="formCriar" class="form-card hidden">
      <h3>Nova lista</h3>
      <label>Título<input id="inpTitulo" type="text" maxlength="50" placeholder="Ex: Jogos do Brasil" /></label>
      <label>Descrição<input id="inpDesc"   type="text" maxlength="200" placeholder="Breve descrição..." /></label>
      <p id="erroCriar" class="erro hidden"></p>
      <div class="form-btns">
        <button class="btn-primary"   id="btnSalvar">Salvar</button>
        <button class="btn-secondary" id="btnCancelar">Cancelar</button>
      </div>
    </div>

    <!-- Grid de listas -->
    <div id="gridListas" class="listas-grid">
      <p id="emptyMsg" class="empty hidden">Você ainda não criou nenhuma lista.</p>
    </div>

  </main>

  <!-- Modal de jogos da lista -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitulo"></h2>
        <button id="btnFecharModal">✕</button>
      </div>

      <!-- Adicionar jogo à lista -->
      <div class="modal-add">
        <select id="selJogoModal"><option value="">Selecione um jogo para adicionar...</option></select>
        <button class="btn-primary" id="btnAddJogo">Adicionar</button>
      </div>
      <p id="erroModal" class="erro hidden"></p>

      <!-- Jogos da lista -->
      <div id="modalJogos" class="jogos-lista"></div>
      <p id="emptyModal" class="empty hidden">Nenhum jogo nessa lista ainda.</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/listas.js"></script>
</body>
</html>
