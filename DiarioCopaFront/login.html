<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Diário Digital Copa 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <!-- Auth CSS (separado, na pasta css/) -->
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- Botão voltar para a landing -->
  <button class="auth-back-btn" onclick="window.location.href='index.html'">← Voltar</button>

  <div class="auth-page">

    <!-- Decorações de fundo -->
    <div class="auth-circle-1"></div>
    <div class="auth-circle-2"></div>

    <!-- Card central -->
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">⚽ DIÁRIO <span class="accent">DIGITAL</span></div>
      <p class="auth-tagline">Copa do Mundo 2026 · Sua memória esportiva</p>

      <!-- Tabs de navegação login ↔ cadastro -->
      <div class="auth-tabs" role="tablist">
        <button
          class="auth-tab active"
          id="tab-login"
          role="tab"
          aria-selected="true"
          aria-controls="form-login"
          onclick="switchTab('login')"
        >Entrar</button>
        <button
          class="auth-tab"
          id="tab-register"
          role="tab"
          aria-selected="false"
          aria-controls="form-register"
          onclick="switchTab('register')"
        >Criar conta</button>
      </div>

      <!-- ---- FORMULÁRIO DE LOGIN ---- -->
      <form id="form-login" class="auth-form" novalidate onsubmit="handleLogin(event)">

        <div id="login-error" class="auth-error" role="alert"></div>
        <div id="login-success" class="auth-success" role="status"></div>

        <div class="auth-fg">
          <label for="login-email">E-mail</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth-fg">
          <label for="login-password">Senha</label>
          <div class="input-wrap">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-pw"
              aria-label="Mostrar senha"
              onclick="togglePassword('login-password')"
            >👁</button>
          </div>
        </div>

        <div class="auth-forgot">
          <a href="#" onclick="handleForgotPassword(event)">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-auth" id="btn-login">Entrar no Diário</button>

        <p class="auth-switch">
          Não tem conta?
          <button type="button" onclick="switchTab('register')">Cadastre-se gratuitamente</button>
        </p>

      </form>

      <!-- ---- FORMULÁRIO DE CADASTRO ---- -->
      <form id="form-register" class="auth-form hidden" novalidate onsubmit="handleRegister(event)">

        <div id="register-error" class="auth-error" role="alert"></div>
        <div id="register-success" class="auth-success" role="status"></div>

        <div class="auth-fg">
          <label for="reg-name">Nome completo</label>
          <input
            type="text"
            id="reg-name"
            name="name"
            placeholder="Seu nome"
            autocomplete="name"
            required
          />
        </div>

        <div class="auth-fg">
          <label for="reg-email">E-mail</label>
          <input
            type="email"
            id="reg-email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="fields-row">

          <div class="auth-fg">
            <label for="reg-password">Senha</label>
            <div class="input-wrap">
              <input
                type="password"
                id="reg-password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="toggle-pw"
                aria-label="Mostrar senha"
                onclick="togglePassword('reg-password')"
              >👁</button>
            </div>
          </div>

          <div class="auth-fg">
            <label for="reg-confirm">Confirmar senha</label>
            <div class="input-wrap">
              <input
                type="password"
                id="reg-confirm"
                name="confirm"
                placeholder="Repita a senha"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="toggle-pw"
                aria-label="Mostrar confirmação"
                onclick="togglePassword('reg-confirm')"
              >👁</button>
            </div>
          </div>

        </div>

        <button type="submit" class="btn-auth" id="btn-register">Criar minha conta</button>

        <p class="auth-terms">
          Ao criar uma conta, você concorda com os
          <a href="#">Termos de Uso</a> e a
          <a href="#">Política de Privacidade</a>.
        </p>

        <p class="auth-switch">
          Já tem conta?
          <button type="button" onclick="switchTab('login')">Entrar</button>
        </p>

      </form>

    </div><!-- /auth-card -->
  </div><!-- /auth-page -->

  <!-- api.js deve vir antes do auth.js -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
